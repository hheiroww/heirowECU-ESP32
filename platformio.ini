[platformio]
default_envs = esp32
src_dir = firmware

[env]
platform = platformio/espressif32@6.12.0
framework = arduino
monitor_speed = 115200
board_build.embed_txtfiles = dashboard/index.html
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DELM_RX_PIN=16
    -DELM_TX_PIN=17

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DELM_RX_PIN=18
    -DELM_TX_PIN=17

[env:esp32-demo]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DHEIROWECU_DEMO=1

[env:esp32-serial]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DHEIROWECU_SERIAL_FEED=1

[env:esp32s3-demo]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DHEIROWECU_DEMO=1

[env:esp32s3-serial]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DHEIROWECU_SERIAL_FEED=1
